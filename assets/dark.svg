<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="1180" height="610" rx="24"/></clipPath>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1180" height="610" fill="#030712"/>

    <circle cx="180" cy="150" r="220" fill="url(#blobBlue)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;30,20;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="480" r="260" fill="url(#blobPurple)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-25,-15;0,0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="100" r="180" fill="url(#blobEmerald)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;15,25;0,0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#22D3EE">
      <circle cx="120" cy="500" r="2"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-30;0,0" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="80" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-25;0,0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="550" r="2" fill="#7C3AED"><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-35;0,0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="200" r="1.8" fill="#10B981"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-28;0,0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- scanline sweep -->
    <rect x="0" y="0" width="1180" height="3" fill="#22D3EE" opacity="0.06">
      <animate attributeName="y" values="0;610;0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- border shimmer -->
    <rect x="2" y="2" width="1176" height="606" rx="22" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.55"/>
    <rect x="2" y="2" width="1176" height="606" rx="22" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

    <!-- ================= LEFT: ASCII PANEL ================= -->
    <g transform="translate(48,60)">
      <rect x="0" y="0" width="392" height="490" rx="18" fill="#0F172A" opacity="0.55" stroke="rgba(255,255,255,.08)"/>
      <g transform="translate(28,44)">
        <animateTransform attributeName="transform" type="translate" values="28,44;28,34;28,44" dur="5s" repeatCount="indefinite" additive="sum"/>
        <text font-family="Consolas, Menlo, monospace" font-size="13" fill="url(#asciiGrad)" filter="url(#glow)">
          <tspan x="0" dy="0" opacity="0"> ██████╗ ███████╗██╗   ██╗<animate attributeName="opacity" to="1" begin="0.2s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0"> ██╔══██╗██╔════╝██║   ██║<animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0"> ██║  ██║█████╗  ██║   ██║<animate attributeName="opacity" to="1" begin="0.8s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0"> ██║  ██║██╔══╝  ╚██╗ ██╔╝<animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0"> ██████╔╝███████╗ ╚████╔╝ <animate attributeName="opacity" to="1" begin="1.4s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0"> ╚═════╝ ╚══════╝  ╚═══╝  <animate attributeName="opacity" to="1" begin="1.7s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="46" opacity="0">   ╭──────────────╮<animate attributeName="opacity" to="1" begin="2.1s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   │  ┌────────┐  │<animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   │  │ ◉    ◉ │  │<animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   │  │   ▽    │  │<animate attributeName="opacity" to="1" begin="2.7s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   │  │ ╰────╯ │  │<animate attributeName="opacity" to="1" begin="2.9s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   │  └────────┘  │<animate attributeName="opacity" to="1" begin="3.1s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">   ╰──────────────╯<animate attributeName="opacity" to="1" begin="3.3s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">     ░░░▓▓▓▓▓░░░<animate attributeName="opacity" to="1" begin="3.5s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">    ░▓▓▓█████▓▓▓░<animate attributeName="opacity" to="1" begin="3.7s" dur="0.4s" fill="freeze"/></tspan>
          <tspan x="0" dy="18" opacity="0">    ░▓▓███████▓▓░<animate attributeName="opacity" to="1" begin="3.9s" dur="0.4s" fill="freeze"/></tspan>
        </text>
        <!-- blinking cursor -->
        <rect x="0" y="322" width="9" height="14" fill="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1s" begin="4.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="28" y="470" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94A3B8" opacity="0">
        system.status: online
        <animate attributeName="opacity" to="1" begin="4.2s" dur="0.6s" fill="freeze"/>
      </text>
    </g>

    <!-- ================= RIGHT: TERMINAL PANEL ================= -->
    <g transform="translate(468,60)">
      <rect x="0" y="0" width="664" height="490" rx="18" fill="#0F172A" opacity="0.6" stroke="rgba(255,255,255,.08)"/>

      <!-- title bar -->
      <rect x="0" y="0" width="664" height="38" rx="18" fill="rgba(255,255,255,.03)"/>
      <circle cx="24" cy="19" r="6" fill="#EF4444" opacity="0.7"/>
      <circle cx="46" cy="19" r="6" fill="#F59E0B" opacity="0.7"/>
      <circle cx="68" cy="19" r="6" fill="#10B981" opacity="0.7"/>
      <text x="332" y="24" font-family="Consolas, Menlo, monospace" font-size="12" fill="#94A3B8" text-anchor="middle">dev@profile: ~</text>

      <g font-family="Consolas, Menlo, monospace">
        <!-- greeting -->
        <text x="32" y="76" font-size="20" fill="#F8FAFC" opacity="0">Hi 👋
          <animate attributeName="opacity" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
        </text>
        <text x="32" y="108" font-size="26" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)" opacity="0">I'm Shrey Goyal
          <animate attributeName="opacity" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
        </text>

        <!-- typing role rotation via clip reveal -->
        <g transform="translate(32,140)">
          <text font-size="16" fill="#22D3EE">
            <tspan>&gt;&#160;</tspan>
          </text>
          <clipPath id="typeClip1"><rect x="0" y="-16" width="0" height="24"><animate attributeName="width" values="0;230;230;0;0" keyTimes="0;0.15;0.4;0.45;1" dur="10s" begin="1.3s" repeatCount="indefinite"/></rect></clipPath>
          <text x="18" font-size="16" fill="#F8FAFC" clip-path="url(#typeClip1)">Software Developer</text>

          <clipPath id="typeClip2"><rect x="0" y="-16" width="0" height="24"><animate attributeName="width" values="0;0;220;220;0;0" keyTimes="0;0.45;0.6;0.85;0.9;1" dur="10s" begin="1.3s" repeatCount="indefinite"/></rect></clipPath>
          <text x="18" font-size="16" fill="#F8FAFC" clip-path="url(#typeClip2)">Full Stack Engineer</text>

          <rect x="18" y="-16" width="2" height="20" fill="#22D3EE">
            <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="x" values="18;248;18;238;18" keyTimes="0;0.15;0.45;0.6;1" dur="10s" begin="1.3s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- info list -->
        <g font-size="13" fill="#94A3B8">
          <text x="32" y="196" opacity="0">📍 Zirakpur, Punjab, India<animate attributeName="opacity" to="1" begin="2.0s" dur="0.4s" fill="freeze"/></text>
          <text x="32" y="220" opacity="0">🎓 B.Tech CSE, Thapar Institute<animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/></text>
          <text x="32" y="244" opacity="0">💡 Building full-stack systems @ SuccessBrew<animate attributeName="opacity" to="1" begin="2.6s" dur="0.4s" fill="freeze"/></text>
          <text x="32" y="268" opacity="0">🏆 National Winner — SIH 2025<animate attributeName="opacity" to="1" begin="2.9s" dur="0.4s" fill="freeze"/></text>
          <text x="32" y="292" opacity="0">✉️ shreygoyal50@gmail.com<animate attributeName="opacity" to="1" begin="3.2s" dur="0.4s" fill="freeze"/></text>
        </g>

        <!-- skills -->
        <text x="32" y="330" font-size="13" fill="#F8FAFC" opacity="0">Skills<animate attributeName="opacity" to="1" begin="3.5s" dur="0.4s" fill="freeze"/></text>
        <g font-size="12" fill="#F8FAFC">
          <!-- pill helper pattern repeated -->
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.6s" dur="0.4s" fill="freeze"/>
            <rect x="32" y="344" width="66" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></rect>
            <text x="65" y="361" text-anchor="middle">React</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.65s" dur="0.4s" fill="freeze"/>
            <rect x="106" y="344" width="76" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect>
            <text x="144" y="361" text-anchor="middle">FastAPI</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.7s" dur="0.4s" fill="freeze"/>
            <rect x="190" y="344" width="78" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
            <text x="229" y="361" text-anchor="middle">Node.js</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.75s" dur="0.4s" fill="freeze"/>
            <rect x="276" y="344" width="92" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
            <text x="322" y="361" text-anchor="middle">TypeScript</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.8s" dur="0.4s" fill="freeze"/>
            <rect x="376" y="344" width="82" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
            <text x="417" y="361" text-anchor="middle">Tailwind</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.85s" dur="0.4s" fill="freeze"/>
            <rect x="466" y="344" width="70" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
            <text x="501" y="361" text-anchor="middle">Python</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.9s" dur="0.4s" fill="freeze"/>
            <rect x="32" y="380" width="68" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
            <text x="66" y="397" text-anchor="middle">Firebase</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="3.95s" dur="0.4s" fill="freeze"/>
            <rect x="106" y="380" width="82" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.4s" repeatCount="indefinite"/></rect>
            <text x="147" y="397" text-anchor="middle">Postgres</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="4.0s" dur="0.4s" fill="freeze"/>
            <rect x="194" y="380" width="60" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
            <text x="224" y="397" text-anchor="middle">SQL</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="4.05s" dur="0.4s" fill="freeze"/>
            <rect x="260" y="380" width="52" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.8s" repeatCount="indefinite"/></rect>
            <text x="286" y="397" text-anchor="middle">Git</text>
          </g>
          <g opacity="0"><animate attributeName="opacity" to="1" begin="4.1s" dur="0.4s" fill="freeze"/>
            <rect x="318" y="380" width="66" height="26" rx="13" fill="rgba(124,58,237,.15)" stroke="url(#accentGrad)" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
            <text x="351" y="397" text-anchor="middle">Sklearn</text>
          </g>
        </g>

        <!-- social icons -->
        <g transform="translate(32,436)" opacity="0">
          <animate attributeName="opacity" to="1" begin="4.4s" dur="0.5s" fill="freeze"/>
          <line x1="0" y1="-16" x2="632" y2="-16" stroke="rgba(255,255,255,.08)"/>
          <g fill="none" stroke="#F8FAFC" stroke-width="1.4" filter="url(#glow)">
            <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,.04)"/>
            <text x="14" y="19" text-anchor="middle" font-size="13" fill="#F8FAFC" stroke="none" font-family="Consolas, Menlo, monospace">GH</text>

            <circle cx="58" cy="14" r="14" fill="rgba(255,255,255,.04)"/>
            <text x="58" y="19" text-anchor="middle" font-size="12" fill="#F8FAFC" stroke="none" font-family="Consolas, Menlo, monospace">in</text>

            <circle cx="102" cy="14" r="14" fill="rgba(255,255,255,.04)"/>
            <text x="102" y="19" text-anchor="middle" font-size="11" fill="#F8FAFC" stroke="none" font-family="Consolas, Menlo, monospace">LC</text>
          </g>
          <g fill="none" stroke="#22D3EE" stroke-width="1">
            <circle cx="14" cy="14" r="14"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
            <circle cx="58" cy="14" r="14"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
            <circle cx="102" cy="14" r="14"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
